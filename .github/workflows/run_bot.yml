name: Run Serverless F1 Discord Bot

on:
  workflow_run:
    workflows: ["Update F1 API"]
    types:
      - completed
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Bot Update Task
      env:
        # Pass your bot token securely from repository secrets
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: |
        python f1_bot.py